[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "outpost"
version = "0.1.0"
description = "Outpost CLI — self-service environment provisioning"
requires-python = ">=3.10"
dependencies = ["click>=8.5.0", "httpx>=0.28.1", "rich>=15.0.0", "pyyaml>=6.0"]

[project.scripts]
outpost = "outpost.cli:cli"