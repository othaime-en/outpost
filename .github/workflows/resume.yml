name: Resume Environment

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: "UUID of the paused environment to resume"
        required: true
        type: string
      region:
        description: "AWS region the environment was provisioned in"
        required: false
        type: string
        default: "us-east-1"
      actor:
        description: "Who triggered this — always a real username; resume is never dispatched automatically"
        required: false
        type: string
        default: "system"

permissions:
  id-token: write # required for OIDC -> AWS
  contents: read

jobs:
  resume:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — check required secrets
        # Same rationale as pause.yml — no Terraform involved, this talks
        # directly to the already-provisioned ECS service / RDS instance.
        id: preflight
        run: |
          missing=()
          [ -z "${{ secrets.AWS_ROLE_ARN }}" ] && missing+=("AWS_ROLE_ARN")
          [ -z "${{ secrets.CALLBACK_BASE_URL }}" ] && missing+=("CALLBACK_BASE_URL")
          [ -z "${{ secrets.CALLBACK_SECRET }}" ] && missing+=("CALLBACK_SECRET")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping resume — missing secrets: ${missing[*]}. See .github/workflows/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS via OIDC
        if: steps.preflight.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Start RDS instance
        # Started before the ECS scale-up on purpose — bringing the app
        # back up before its database exists would just crash-loop it.
        #
        # Guards against AWS's 7-day forced-restart limit: if the instance
        # already shows "available" (AWS auto-restarted it while this
        # environment sat paused), skip start-db-instance entirely rather
        # than erroring on an already-running instance — see this module's
        # docstring in routers/environments.py, "GRACE PERIOD & PAUSE
        # SAFETY NET", for the underlying constraint.
        if: steps.preflight.outputs.configured == 'true'
        run: |
          DB_ID="outpost-$(echo "${{ inputs.env_id }}" | cut -c1-8)"
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier "$DB_ID" \
            --region "${{ inputs.region }}" \
            --query 'DBInstances[0].DBInstanceStatus' --output text)
          echo "Current RDS status: $STATUS"
          if [ "$STATUS" == "stopped" ]; then
            aws rds start-db-instance --db-instance-identifier "$DB_ID" --region "${{ inputs.region }}"
          else
            echo "RDS instance already '$STATUS' — not calling start-db-instance (likely AWS's 7-day auto-restart)"
          fi
          aws rds wait db-instance-available --db-instance-identifier "$DB_ID" --region "${{ inputs.region }}"

      - name: Scale ECS service back up
        if: steps.preflight.outputs.configured == 'true'
        run: |
          aws ecs update-service \
            --cluster outpost-shared \
            --service "outpost-${{ inputs.env_id }}" \
            --desired-count 1 \
            --region "${{ inputs.region }}" \
            --no-cli-pager
          aws ecs wait services-stable \
            --cluster outpost-shared \
            --services "outpost-${{ inputs.env_id }}" \
            --region "${{ inputs.region }}"

      - name: Callback — Success
        # No `outputs` key in this payload — see environment_callback()'s
        # RESUMING branch in routers/environments.py: it deliberately does
        # NOT overwrite env.outputs on a RESUMING->RUNNING transition, since
        # nothing here re-ran `terraform apply` and the original provision
        # outputs (endpoints, ARNs) are still correct as they are.
        if: success() && steps.preflight.outputs.configured == 'true'
        run: |
          PAYLOAD=$(jq -nc --arg actor "${{ inputs.actor }}" '{status: "RUNNING", actor: $actor}')
          curl -sf -X POST \
            "${{ secrets.CALLBACK_BASE_URL }}/environments/${{ inputs.env_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d "$PAYLOAD"

      - name: Callback — Failure
        if: failure() && steps.preflight.outputs.configured == 'true'
        run: |
          PAYLOAD=$(jq -nc \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{status: "FAILED", error: ("Resume failed. See run: " + $url)}')
          curl -sf -X POST \
            "${{ secrets.CALLBACK_BASE_URL }}/environments/${{ inputs.env_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d "$PAYLOAD"
