name: Destroy Environment

on:
  workflow_dispatch:
    inputs:
      env_id:
        description: "UUID of the environment to destroy"
        required: true
        type: string
      region:
        description: "AWS region the environment was provisioned in"
        required: false
        type: string
        default: "us-east-1"
      actor:
        description: "Who triggered this — a username, or 'cron' for TTL auto-destroy"
        required: false
        type: string
        default: "system"

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Preflight — check required secrets
        # Same rationale as provision.yml — AWS bootstrap hasn't run yet in
        # this repo. Skip cleanly instead of failing on the OIDC step.
        id: preflight
        run: |
          missing=()
          [ -z "${{ secrets.AWS_ROLE_ARN }}" ] && missing+=("AWS_ROLE_ARN")
          [ -z "${{ secrets.TF_STATE_BUCKET }}" ] && missing+=("TF_STATE_BUCKET")
          [ -z "${{ secrets.TF_LOCK_TABLE }}" ] && missing+=("TF_LOCK_TABLE")
          [ -z "${{ secrets.SHARED_VPC_ID }}" ] && missing+=("SHARED_VPC_ID")
          [ -z "${{ secrets.CALLBACK_BASE_URL }}" ] && missing+=("CALLBACK_BASE_URL")
          [ -z "${{ secrets.CALLBACK_SECRET }}" ] && missing+=("CALLBACK_SECRET")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping destroy — missing secrets: ${missing[*]}. See .github/workflows/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS via OIDC
        if: steps.preflight.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}

      - name: Setup Terraform
        if: steps.preflight.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.16.0"

      - name: Terraform Init
        if: steps.preflight.outputs.configured == 'true'
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=envs/${{ inputs.env_id }}/terraform.tfstate" \
            -backend-config="region=${{ inputs.region }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Terraform Destroy
        if: steps.preflight.outputs.configured == 'true'
        working-directory: terraform
        # All non-vpc_id variables (env_name, team, env_type, ttl_hours) are
        # only referenced by resource attributes/tags during apply — destroy
        # only needs enough var values to satisfy validation, so we pass
        # harmless placeholders for the ones Terraform still requires.
        run: |
          terraform destroy -auto-approve \
            -var="env_id=${{ inputs.env_id }}" \
            -var="env_name=destroy" \
            -var="team=destroy" \
            -var="env_type=dev" \
            -var="ttl_hours=1" \
            -var="region=${{ inputs.region }}" \
            -var="vpc_id=${{ secrets.SHARED_VPC_ID }}"

      - name: Callback — Success
        if: success() && steps.preflight.outputs.configured == 'true'
        run: |
          PAYLOAD=$(jq -nc --arg actor "${{ inputs.actor }}" '{status: "DESTROYED", actor: $actor}')
          curl -sf -X POST \
            "${{ secrets.CALLBACK_BASE_URL }}/environments/${{ inputs.env_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d "$PAYLOAD"

      - name: Callback — Failure
        if: failure() && steps.preflight.outputs.configured == 'true'
        run: |
          PAYLOAD=$(jq -nc \
            --arg url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{status: "FAILED", error: ("Terraform destroy failed. See run: " + $url)}')
          curl -sf -X POST \
            "${{ secrets.CALLBACK_BASE_URL }}/environments/${{ inputs.env_id }}/callback" \
            -H "Content-Type: application/json" \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            -d "$PAYLOAD"
