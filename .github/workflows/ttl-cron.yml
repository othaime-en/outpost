name: TTL Enforcement

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: # allow manual trigger for testing

permissions:
  actions: write
  contents: read

jobs:
  enforce-ttl:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — check required secrets
        # This workflow runs on a schedule, so unlike provision.yml/destroy.yml
        # it fires automatically every 15 minutes regardless of whether anyone
        # triggered it. It doesn't need AWS secrets (it only calls the API and
        # dispatches pause.yml/destroy.yml), just the callback ones. Skip
        # cleanly instead of a failed run (and notification email) every 15
        # minutes until those are set. Remove this step once they are.
        id: preflight
        run: |
          missing=()
          [ -z "${{ secrets.CALLBACK_BASE_URL }}" ] && missing+=("CALLBACK_BASE_URL")
          [ -z "${{ secrets.CALLBACK_SECRET }}" ] && missing+=("CALLBACK_SECRET")

          if [ ${#missing[@]} -gt 0 ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping TTL enforcement — missing secrets: ${missing[*]}. See .github/workflows/README.md."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Process TTL state machine
        # Single call that does all of the grace-period/pause state-machine
        # reasoning server-side (RUNNING->EXPIRING, EXPIRING->PAUSING,
        # PAUSED->DESTROYING, plus the pause-expiring-soon warning) — see
        # process_ttl()'s docstring in routers/environments.py. This step's
        # only job is handing the resulting to_pause/to_destroy lists to the
        # dispatch steps below; it makes no state-machine decisions itself.
        # Supersedes the old "Fetch expired environments" step, which called
        # GET /environments/expired — a single unconditional RUNNING->destroy
        # check with no grace period at all.
        if: steps.preflight.outputs.configured == 'true'
        id: process
        run: |
          RESPONSE=$(curl -sf -X POST \
            -H "X-Callback-Secret: ${{ secrets.CALLBACK_SECRET }}" \
            "${{ secrets.CALLBACK_BASE_URL }}/environments/process-ttl")
          echo "result=$RESPONSE" >> "$GITHUB_OUTPUT"
          echo "process-ttl result: $RESPONSE"

      - name: Dispatch pause for grace-period-lapsed environments
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_JSON: ${{ steps.process.outputs.result }}
        run: |
          echo "$RESULT_JSON" | jq -c '.to_pause[]' | while read -r target; do
            env_id=$(echo "$target" | jq -r '.env_id')
            region=$(echo "$target" | jq -r '.region')
            echo "Dispatching pause for $env_id ($region) — grace period elapsed"
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pause.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"env_id\":\"$env_id\",\"region\":\"$region\",\"actor\":\"cron\"}}"
            sleep 2   # avoid tripping GitHub API rate limits when several envs transition together
          done

      - name: Dispatch destroy for pause-window-lapsed environments
        # actor is "cron_pause_expired", not "cron" — environment_callback()
        # in routers/environments.py checks this exact string to log
        # ENV_PAUSE_EXPIRED_DESTROYED instead of an ordinary ENV_DESTROYED,
        # since this destroy was never requested by a human and was
        # preceded by two separate advance warnings (EXPIRING, then PAUSED).
        if: steps.preflight.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT_JSON: ${{ steps.process.outputs.result }}
        run: |
          echo "$RESULT_JSON" | jq -c '.to_destroy[]' | while read -r target; do
            env_id=$(echo "$target" | jq -r '.env_id')
            region=$(echo "$target" | jq -r '.region')
            echo "Dispatching destroy for $env_id ($region) — pause window elapsed"
            curl -sf -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/destroy.yml/dispatches" \
              -d "{\"ref\":\"main\",\"inputs\":{\"env_id\":\"$env_id\",\"region\":\"$region\",\"actor\":\"cron_pause_expired\"}}"
            sleep 2
          done
