name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-lint-test:
    name: API — Lint & Test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: outpost_test
          POSTGRES_USER: outpost
          POSTGRES_PASSWORD: outpost
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: pip install -r api/requirements.txt

      - name: Lint with ruff
        run: ruff check api/

      - name: Run Alembic migrations against test DB
        run: cd api && alembic upgrade head
        env:
          DATABASE_URL: postgresql://outpost:outpost@localhost:5432/outpost_test
          SECRET_KEY: ci-test-secret-key

      - name: Run tests
        run: pytest api/tests/ -v --tb=short
        env:
          DATABASE_URL: postgresql://outpost:outpost@localhost:5432/outpost_test
          SECRET_KEY: ci-test-secret-key
          CALLBACK_SECRET: ci-callback-secret
          PYTHONPATH: api

  ui-lint:
    name: UI — Typecheck & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: cd ui && npm ci

      - name: TypeScript typecheck
        run: cd ui && npm run typecheck

      - name: Lint
        run: cd ui && npm run lint

  terraform-validate:
    name: Terraform — Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Terraform fmt check
        run: terraform fmt -check -recursive
        working-directory: terraform

      - name: Terraform init (no backend)
        run: terraform init -backend=false
        working-directory: terraform

      - name: Terraform validate
        run: terraform validate
        working-directory: terraform

  docker-build:
    name: Docker — Build (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, ui]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: false
          tags: outpost-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
